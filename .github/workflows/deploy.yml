name: validate-package-deploy
on:
  pull_request:
    types: [closed]
    branches: [main]
jobs:
  validate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python build_artifact.py --out ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: ml-artifact
          path: ./dist
  deploy:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ml-artifact
          path: ./dist
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az ml environment create --file ./dist/environment.yml --workspace-name Contoso --resource-group gaurav.purohit-rg